# Server configs
app:
  # Server name
  name: ${MET_SERVER_NAME:-met}
  # Env mode (dev or prod)
  mode: ${MET_SERVER_MODE:-prod}
  # HTTP port
  port: ${MET_SERVER_PORT:-8000}
  # Hostname
  hostname: ${MET_SERVER_HOSTNAME:-127.0.0.1}
  # TLS configs
  tls:
    status: ${MET_SERVER_TLS_STATUS:-off}
    crt_path: ${MET_SERVER_TLS_PEMPATH:-cert/server.crt}
    key_path: ${MET_SERVER_TLS_KEYPATH:-cert/server.key}

  # Global timeout
  timeout: ${MET_SERVER_TIMEOUT:-50}

  # Prometheus metrics endpoint
  metrics:
    username: ${MET_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${MET_SERVER_PROM_METRICS_SECRET:-secret}

  # Log configs
  log:
    # Log level, it can be debug, info, warn, error, panic, fatal
    level: ${MET_SERVER_LOG_LEVEL:-info}
    # Output can be stdout or abs path to log file /var/logs/met.log
    output: ${MET_SERVER_LOG_OUTPUT:-stdout}
    # Format can be json
    format: ${MET_SERVER_LOG_FORMAT:-json}

  # Database configs
  database:
    # Database driver (postgres, postgresql, or sqlite)
    driver: ${MET_DATABASE_DRIVER:-sqlite}
    # PostgreSQL specific configs
    host: ${MET_DATABASE_HOST:-localhost}
    port: ${MET_DATABASE_PORT:-5432}
    username: ${MET_DATABASE_USERNAME:-postgres}
    password: ${MET_DATABASE_PASSWORD:-postgres}
    name: ${MET_DATABASE_NAME:-met}
    # Connection pool settings
    max_open_conns: ${MET_DATABASE_MAX_OPEN_CONNS:-25}
    max_idle_conns: ${MET_DATABASE_MAX_IDLE_CONNS:-10}
    conn_max_lifetime: ${MET_DATABASE_CONN_MAX_LIFETIME:-300}
    # SQLite specific config (path to database file)
    datasource: ${MET_DATABASE_DATASOURCE:-./cache/met.db}
