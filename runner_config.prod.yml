# gRPC server configs
app:
  # Server name
  name: ${FINN_SERVER_NAME:-finn}
  # Env mode (dev or prod)
  mode: ${FINN_SERVER_MODE:-prod}
  # gRPC port
  port: ${FINN_RUNNER_GRPC_PORT:-9090}
  # Hostname (for logging / display)
  hostname: ${FINN_SERVER_HOSTNAME:-127.0.0.1}
  # gRPC TLS configs
  tls:
    status: ${FINN_SERVER_TLS_STATUS:-off}
    crt_path: ${FINN_SERVER_TLS_PEMPATH:-cert/server.crt}
    key_path: ${FINN_SERVER_TLS_KEYPATH:-cert/server.key}

  # Log configs
  log:
    # Log level: debug, info, warn, error, panic, fatal
    level: ${FINN_SERVER_LOG_LEVEL:-debug}
    # Output: stdout or path e.g. /var/logs/finn.log
    output: ${FINN_SERVER_LOG_OUTPUT:-stdout}
    # Format: json
    format: ${FINN_SERVER_LOG_FORMAT:-json}

  # Database configs
  database:
    driver: ${FINN_RUNNER_DATABASE_DRIVER:-bolt}
    path: ${FINN_RUNNER_DATABASE_PATH:-./cache/finn_runner.db}
