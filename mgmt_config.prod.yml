# Server configs
app:
  # Server name
  name: ${FINN_SERVER_NAME:-finn}
  # Env mode (dev or prod)
  mode: ${FINN_SERVER_MODE:-prod}
  # HTTP port
  port: ${FINN_SERVER_PORT:-8000}
  # Hostname
  hostname: ${FINN_SERVER_HOSTNAME:-127.0.0.1}
  # TLS configs
  tls:
    status: ${FINN_SERVER_TLS_STATUS:-off}
    crt_path: ${FINN_SERVER_TLS_PEMPATH:-cert/server.crt}
    key_path: ${FINN_SERVER_TLS_KEYPATH:-cert/server.key}

  # Global timeout
  timeout: ${FINN_SERVER_TIMEOUT:-50}

  # Prometheus metrics endpoint
  metrics:
    username: ${FINN_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${FINN_SERVER_PROM_METRICS_SECRET:-secret}

  # Log configs
  log:
    # Log level, it can be debug, info, warn, error, panic, fatal
    level: ${FINN_SERVER_LOG_LEVEL:-info}
    # Output can be stdout or abs path to log file /var/logs/finn.log
    output: ${FINN_SERVER_LOG_OUTPUT:-stdout}
    # Format can be json
    format: ${FINN_SERVER_LOG_FORMAT:-json}

  # Database configs
  database:
    # Database driver (postgres, postgresql, or sqlite)
    driver: ${FINN_DATABASE_DRIVER:-sqlite}
    # PostgreSQL specific configs
    host: ${FINN_DATABASE_HOST:-localhost}
    port: ${FINN_DATABASE_PORT:-5432}
    username: ${FINN_DATABASE_USERNAME:-postgres}
    password: ${FINN_DATABASE_PASSWORD:-postgres}
    name: ${FINN_DATABASE_NAME:-finn}
    # Connection pool settings
    max_open_conns: ${FINN_DATABASE_MAX_OPEN_CONNS:-25}
    max_idle_conns: ${FINN_DATABASE_MAX_IDLE_CONNS:-10}
    conn_max_lifetime: ${FINN_DATABASE_CONN_MAX_LIFETIME:-300}
    # SQLite specific config (path to database file)
    datasource: ${FINN_DATABASE_DATASOURCE:-./cache/finn_mgmt.db}

  # AI provider configs (Genkit: openai, googleai, vertexai, anthropic)
  ai:
    enabled: ${FINN_AI_ENABLED:-false}
    provider: ${FINN_AI_PROVIDER:-openai}
    model: ${FINN_AI_MODEL:-openai/gpt-5-mini}
    api_key: ${FINN_AI_API_KEY:-}
    base_url: ${FINN_AI_BASE_URL:-}
    # Vertex AI only
    project_id: ${FINN_AI_PROJECT_ID:-}
    location: ${FINN_AI_LOCATION:-}
