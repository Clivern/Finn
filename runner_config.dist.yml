# Server configs
app:
  # Server name
  name: ${LAPIN_SERVER_NAME:-lapin}
  # Env mode (dev or prod)
  mode: ${LAPIN_SERVER_MODE:-prod}
  # HTTP port
  port: ${LAPIN_SERVER_PORT:-8000}
  # Hostname
  hostname: ${LAPIN_SERVER_HOSTNAME:-127.0.0.1}
  # TLS configs
  tls:
    status: ${LAPIN_SERVER_TLS_STATUS:-off}
    crt_path: ${LAPIN_SERVER_TLS_PEMPATH:-cert/server.crt}
    key_path: ${LAPIN_SERVER_TLS_KEYPATH:-cert/server.key}

  # Global timeout
  timeout: ${LAPIN_SERVER_TIMEOUT:-50}

  # Prometheus metrics endpoint
  metrics:
    username: ${LAPIN_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${LAPIN_SERVER_PROM_METRICS_SECRET:-secret}

  # Log configs
  log:
    # Log level, it can be debug, info, warn, error, panic, fatal
    level: ${LAPIN_SERVER_LOG_LEVEL:-debug}
    # Output can be stdout or abs path to log file /var/logs/lapin.log
    output: ${LAPIN_SERVER_LOG_OUTPUT:-stdout}
    # Format can be json
    format: ${LAPIN_SERVER_LOG_FORMAT:-json}
